<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b53"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="IGV JCristobal"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-180.png"><link rel="icon" type="image/png" href="./icon-192.png"><title>Calculadora IGV · By JCristobal</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#172b49;background:#eef3fa}*{box-sizing:border-box}body{margin:0;padding:20px 12px}.app{max-width:500px;margin:auto;background:#fff;border-radius:22px;padding:24px;box-shadow:0 10px 30px #15335917}h1{font-size:1.45rem;margin:0;text-align:center}.brand{text-align:center;color:#60758e;margin:5px 0 23px;font-size:.85rem}.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modes button{border:1px solid #b9cbe2;background:white;color:#244368;padding:12px 6px;border-radius:10px;font-weight:700}.modes button.active{background:#163f83;color:white;border-color:#163f83}label{display:block;font-weight:650;margin:16px 0 7px}input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #bac9da;font:inherit;color:inherit;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.results{background:#f0f5ff;padding:16px;border-radius:14px;margin-top:22px}.line{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin:12px 0;flex-wrap:wrap}.line b{font-variant-numeric:tabular-nums}.line.total{border-top:1px solid #cddbf1;padding-top:15px;color:#164995;font-size:1.13rem}.note{font-size:.75rem;line-height:1.45;color:#667b91;margin-top:17px}.copy{width:100%;background:#174b9b;color:white;border:0;border-radius:11px;padding:13px;margin-top:15px;font-weight:700;font:inherit}.err{color:#b91c1c;font-size:.85rem;min-height:1.4em}footer{text-align:center;color:#72859a;font-size:.77rem;padding-top:8px}</style></head><body><main class="app"><h1>Calculadora de IGV</h1><div class="brand">Perú · By JCristobal</div><div class="modes"><button type="button" id="sin" class="active">Precio sin IGV</button><button type="button" id="con">Precio con IGV</button></div><div class="grid"><div><label for="cantidad">Cantidad</label><input id="cantidad" inputmode="decimal" value="315"></div><div><label for="precio">Precio unitario (S/)</label><input id="precio" inputmode="decimal" value="19"></div></div><div class="grid"><div><label for="tasa">IGV (%)</label><input id="tasa" inputmode="decimal" value="18"></div><div><label for="dec">Decimales</label><select id="dec"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div></div><section class="results" aria-live="polite"><div class="line"><span>Subtotal (cantidad × precio)</span><b id="subtotal"></b></div><div class="line"><span>Base imponible</span><b id="base"></b></div><div class="line"><span>IGV</span><b id="igv"></b></div><div class="line total"><strong>Total con IGV</strong><b id="total"></b></div></section><p id="error" class="err"></p><button id="copiar" class="copy">Copiar resultados</button><p class="note">Herramienta referencial. Para emitir facturas verifica las reglas de redondeo y tributación aplicables.</p><footer>By JCristobal</footer></main><script>let modo='sin';const $=x=>document.getElementById(x);function num(s){s=s.trim().replace(/\s/g,'');const i=s.lastIndexOf('.'),j=s.lastIndexOf(',');if(i>=0&&j>=0){if(i>j)s=s.replace(/,/g,'');else s=s.replace(/\./g,'').replace(',','.')}else s=s.replace(',','.');return /^\d+(\.\d*)?$/.test(s)?Number(s):NaN}let last='';function calc(){let q=num($('cantidad').value),p=num($('precio').value),t=num($('tasa').value)/100,d=Number($('dec').value);if(![q,p,t].every(Number.isFinite)||q<0||p<0||t<0||t>1){$('error').textContent='Ingresa cantidades, precios e IGV válidos.';for(const id of ['subtotal','base','igv','total'])$(id).textContent='—';return} $('error').textContent='';let sub=q*p,base=modo==='sin'?sub:sub/(1+t),igv=modo==='sin'?sub*t:sub-base,total=base+igv;const fmt=x=>'S/ '+x.toLocaleString('es-PE',{minimumFractionDigits:d,maximumFractionDigits:d});for(const [id,value] of Object.entries({subtotal:sub,base,igv,total}))$(id).textContent=fmt(value);last=`Cantidad: ${q}\nPrecio unitario: ${fmt(p)}\nSubtotal: ${fmt(sub)}\nBase imponible: ${fmt(base)}\nIGV: ${fmt(igv)}\nTotal con IGV: ${fmt(total)}`};for(const mode of ['sin','con'])$(mode).onclick=()=>{modo=mode;$('sin').classList.toggle('active',modo==='sin');$('con').classList.toggle('active',modo==='con');calc()};for(const id of ['cantidad','precio','tasa','dec'])$(id).addEventListener('input',calc);$('copiar').onclick=async()=>{try{await navigator.clipboard.writeText(last);$('copiar').textContent='¡Copiado!';setTimeout(()=>$('copiar').textContent='Copiar resultados',1200)}catch(e){alert('Selecciona y copia los resultados manualmente.')}};calc();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
